apiVersion: v1
kind: Service

metadata:
  name: {{ include "efftest.postgresName" . }}
  labels:
  {{- include "efftest.labels" . | nindent 4}}

spec:
  clusterIP: None

  selector:
   {{ include "efftest.selectorLabels" . | nindent 4}}

  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.targetPort }}