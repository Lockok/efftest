apiVersion: v1
kind: Service

metadata:
  name: {{ include  "efftest.appName" . }}
  labels:
  {{- include "efftest.labels" . | nindent 4}}


spec: 
  selector:
    {{ include "efftest.postgresSelectorLabels" . | nindent 4}}

  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      nodePort: {{ .Values.app.service.nodePort }}
  
  type: {{ .Values.app.service.type }}